name: Dependências do Mydbsql
description: Qt 6 (binários oficiais, tools/fetch_qt.py), vcpkg na baseline do projeto e pacotes do sistema.

inputs:
  qt-host:
    description: windows_x86, linux_x64, linux_arm64 ou mac_x64
    required: true
  qt-arch:
    description: win64_msvc2022_64, linux_gcc_64, linux_gcc_arm64 ou clang_64
    required: true
  qt-version:
    description: versão do Qt
    default: "6.11.3"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Pacotes do sistema (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ninja-build \
          libgl1-mesa-dev libegl1 libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1 libfreetype6 \
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
          libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libdbus-1-3 xvfb

    - name: Ninja (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install ninja

    - name: Cache do Qt
      id: qt-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/Qt
        key: qt-${{ inputs.qt-version }}-${{ inputs.qt-arch }}-${{ hashFiles('tools/fetch_qt.py') }}

    - name: Qt ${{ inputs.qt-version }}
      shell: bash
      run: |
        python -m pip install --quiet py7zr
        dir=$(python tools/fetch_qt.py --version "${{ inputs.qt-version }}" --host "${{ inputs.qt-host }}" \
              --arch "${{ inputs.qt-arch }}" --out "${{ runner.temp }}/Qt" | tail -n 1)
        echo "QT_ROOT_DIR=$dir" >> "$GITHUB_ENV"
        echo "$dir/bin" >> "$GITHUB_PATH"

    - name: vcpkg na baseline de vcpkg-configuration.json
      shell: bash
      run: |
        baseline=$(python -c "import json;print(json.load(open('vcpkg-configuration.json'))['default-registry']['baseline'])")
        git clone --quiet https://github.com/microsoft/vcpkg "${{ runner.temp }}/vcpkg"
        git -C "${{ runner.temp }}/vcpkg" checkout --quiet "$baseline"
        if [ "$RUNNER_OS" = "Windows" ]; then
          "${{ runner.temp }}/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
        else
          "${{ runner.temp }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        fi
        echo "VCPKG_ROOT=${{ runner.temp }}/vcpkg" >> "$GITHUB_ENV"
        echo "VCPKG_DEFAULT_BINARY_CACHE=${{ runner.temp }}/vcpkg-cache" >> "$GITHUB_ENV"
        mkdir -p "${{ runner.temp }}/vcpkg-cache"

    - name: Cache binário do vcpkg
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/vcpkg-cache
        key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-
