name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: "Lint (formatação e #ifdef de SO)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -r tools/requirements-dev.txt
      - run: python tools/check_platform_ifdefs.py
      - run: python tools/check_module_deps.py
      - run: python tools/run_clang_format.py src tests bench

  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86-64 GCC,   os: ubuntu-22.04,     qt-host: linux_x64,   qt-arch: linux_gcc_64,      cc: gcc-12,   cxx: g++-12 }
          - { name: Linux x86-64 Clang, os: ubuntu-22.04,     qt-host: linux_x64,   qt-arch: linux_gcc_64,      cc: clang-15, cxx: clang++-15 }
          - { name: Linux ARM64 GCC,    os: ubuntu-24.04-arm, qt-host: linux_arm64, qt-arch: linux_gcc_arm64,   cc: gcc,      cxx: g++ }
          - { name: Windows MSVC,       os: windows-latest,   qt-host: windows_x86, qt-arch: win64_msvc2022_64, cc: cl,       cxx: cl }
          - { name: macOS arm64,        os: macos-latest,     qt-host: mac_x64,     qt-arch: clang_64,          cc: clang,    cxx: clang++, optional: true }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps
        with:
          qt-host: ${{ matrix.qt-host }}
          qt-arch: ${{ matrix.qt-arch }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: python tools/ci_step.py -- cmake --preset debug
      - run: python tools/ci_step.py -- cmake --build --preset debug
      - run: python tools/ci_step.py -- ctest --preset debug

  sanitizers:
    name: Sanitizers (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    env:
      CC: clang
      CXX: clang++
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps
        with:
          qt-host: linux_x64
          qt-arch: linux_gcc_64
      - run: python tools/ci_step.py -- cmake --preset ${{ matrix.preset }} -DMYDB_BUILD_APP=OFF
      - run: python tools/ci_step.py -- cmake --build --preset ${{ matrix.preset }}
      - run: python tools/ci_step.py -- ctest --preset ${{ matrix.preset }}

  integration:
    name: Integração (MySQL 8.4 e MariaDB 11.4)
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
      MYDB_TEST_MYSQL: "host=127.0.0.1;port=3307;user=root;password="
      MYDB_TEST_MARIADB: "host=127.0.0.1;port=3308;user=root;password="
      MYDB_TEST_SCALE: "1"
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f tests/docker-compose.yml up -d
      - uses: ./.github/actions/setup-deps
        with:
          qt-host: linux_x64
          qt-arch: linux_gcc_64
      - run: python tools/ci_step.py -- cmake --preset release -DMYDB_BUILD_APP=OFF -DMYDB_BUILD_BENCHMARKS=OFF
      - run: python tools/ci_step.py -- cmake --build --preset release
      - run: python tools/ci_step.py -- docker compose -f tests/docker-compose.yml up -d --wait
      - run: python tools/ci_step.py -- ctest --preset release -L integration
      - if: failure()
        run: docker compose -f tests/docker-compose.yml logs --tail 50

  coverage:
    name: Cobertura (core/sql)
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps
        with:
          qt-host: linux_x64
          qt-arch: linux_gcc_64
      - run: python -m pip install --quiet gcovr
      - run: python tools/ci_step.py -- cmake --preset debug -DMYDB_BUILD_APP=OFF -DMYDB_BUILD_BENCHMARKS=OFF "-DCMAKE_CXX_FLAGS=--coverage"
      - run: python tools/ci_step.py -- cmake --build --preset debug
      - run: python tools/ci_step.py -- ctest --preset debug -L unit
      - run: python tools/ci_step.py -- gcovr --root . --filter src/core/sql/ --exclude-throw-branches --print-summary --fail-under-line 90 build/debug

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps
        with:
          qt-host: linux_x64
          qt-arch: linux_gcc_64
      - run: python -m pip install --quiet -r tools/requirements-dev.txt
      - run: python tools/ci_step.py -- cmake --preset debug
      - run: python tools/ci_step.py -- cmake --build --preset debug
      - run: python tools/ci_step.py -- cmake --build --preset debug --target clang-tidy

  startup-budget:
    name: Orçamento (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-22.04,   qt-host: linux_x64,   qt-arch: linux_gcc_64,      cc: gcc-12, cxx: g++-12 }
          - { name: windows, os: windows-latest, qt-host: windows_x86, qt-arch: win64_msvc2022_64, cc: cl,     cxx: cl }
          - { name: macos,   os: macos-latest,   qt-host: mac_x64,     qt-arch: clang_64,          cc: clang,  cxx: clang++, optional: true }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps
        with:
          qt-host: ${{ matrix.qt-host }}
          qt-arch: ${{ matrix.qt-arch }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: python tools/ci_step.py -- cmake --preset release -DMYDB_BUILD_TESTS=OFF
      - run: python tools/ci_step.py -- cmake --build --preset release
      - name: --measure-startup (3 execuções)
        shell: bash
        run: |
          exe=build/release/bin/mydbsql
          run() { if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a "$@"; else "$@"; fi; }
          for i in 1 2 3; do run python tools/ci_step.py -- "$exe" "--measure-startup=startup-$i.json"; cat "startup-$i.json"; done
      - name: Benchmarks
        shell: bash
        run: |
          python tools/ci_step.py -- build/release/bench/mydb_bench --benchmark_out=bench-results.json --benchmark_out_format=json
          python tools/ci_step.py -- build/release/bench/mydb_ui_bench --benchmark_out=bench-ui.json --benchmark_out_format=json
      - name: Comparar com o orçamento e o baseline
        shell: bash
        run: |
          python tools/ci_step.py -- python tools/check_budget.py --startup startup-1.json startup-2.json startup-3.json \
            --benchmarks bench-results.json bench-ui.json --budget bench/budget.json \
            --baseline "bench/baseline/${{ matrix.name }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-${{ matrix.name }}
          path: |
            startup-*.json
            bench-results.json
            bench-ui.json
